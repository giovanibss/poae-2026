<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POAE · Painel da avaliação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Barlow:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070A0F; --deck:#0C1219; --line:#1B2733;
  --chart:#E6DECB; --haze:#8494A5; --vfr:#C2506B; --azimuth:#4A87BC;
  --verde:#6FA88A; --ambar:#C8A24A;
  --display:"Cinzel",Georgia,serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --gut:clamp(16px,3vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--chart);font-family:var(--body);font-weight:300;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--azimuth)}
::selection{background:var(--vfr);color:var(--void)}
:focus-visible{outline:1px solid var(--vfr);outline-offset:2px}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--haze)}
.h1{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;font-size:1.55rem;
  font-weight:400;line-height:1.1}
.h3{font-family:var(--display);text-transform:uppercase;font-size:1.05rem;letter-spacing:.04em;
  font-weight:400}
.meta{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#4E5F70}
.dim{color:var(--haze)}

/* ─── moldura ─── */
.topo{position:sticky;top:0;z-index:30;background:rgba(7,10,15,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.topo-l{display:flex;align-items:center;gap:16px;padding:14px var(--gut) 0;flex-wrap:wrap}
.topo-l .h1{flex:1;min-width:200px}
.volta{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#4E5F70;text-decoration:none;margin-bottom:7px}
.volta:hover{color:var(--vfr)}
tr.mv td{background:rgba(194,80,107,.09)}
.placar{border:1px solid var(--vfr);background:linear-gradient(180deg,rgba(194,80,107,.10),rgba(194,80,107,.03));
  padding:20px;margin-bottom:14px}
.placar > h2{font-family:var(--display);text-transform:uppercase;font-size:1rem;letter-spacing:.04em;
  font-weight:400;margin-bottom:4px;color:var(--chart)}
.placar .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--haze);margin-bottom:16px}
.pl-grade{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pl-card{border:1px solid var(--line);background:rgba(7,10,15,.55);padding:14px 16px}
.pl-nome{font-size:.95rem;letter-spacing:.02em;margin-bottom:10px;display:flex;
  align-items:baseline;justify-content:space-between;gap:10px}
.pl-nota{font-family:var(--display);font-size:2.1rem;line-height:1;color:var(--vfr);
  font-variant-numeric:tabular-nums}
.pl-nota.parcial{color:var(--ambar)}
.pl-max{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#4E5F70}
.pl-conta{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--haze);
  line-height:1.9;margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.pl-conta i{font-style:normal;float:right;color:var(--chart)}
.pl-alerta{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ambar);
  margin-top:8px;text-transform:uppercase}
.nota-fw{font-family:var(--mono);font-variant-numeric:tabular-nums}
.prog{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--haze)}
.opt{display:flex;gap:10px;align-items:center;margin:4px 0 2px;cursor:pointer;font-size:.9rem}
.opt input{width:16px;height:16px;flex:none;accent-color:var(--vfr)}
.abas{display:flex;gap:2px;padding:12px var(--gut) 0;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{padding:10px 15px;font-family:var(--mono);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:#4E5F70;border-bottom:1px solid transparent;white-space:nowrap}
.abas button.on{color:var(--chart);border-bottom-color:var(--vfr)}
main{padding:24px var(--gut) 90px;max-width:1400px}

.cx{border:1px solid var(--line);background:var(--deck);padding:20px;margin-bottom:14px}
.cx > h2{font-family:var(--display);text-transform:uppercase;font-size:1rem;letter-spacing:.04em;
  font-weight:400;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.grade{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.dir{margin-left:auto}

label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--haze);margin-bottom:6px}
input,textarea,select{width:100%;background:var(--void);border:1px solid var(--line);
  color:var(--chart);padding:9px 11px;transition:border-color .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--vfr)}
textarea{resize:vertical;min-height:88px;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--haze) 50%),
  linear-gradient(135deg,var(--haze) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.campo{margin-bottom:12px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid var(--line);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  transition:border-color .2s,background .2s,color .2s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#33475C}
.btn.solid{background:var(--vfr);border-color:var(--vfr);color:#fff}
.btn.solid:hover:not(:disabled){background:#a8425a;border-color:#a8425a}
.btn.mini{padding:6px 10px;font-size:9px}
.btn:disabled{opacity:.32;cursor:not-allowed}

table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--haze);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);
  font-weight:400;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.clica{cursor:pointer}
tr.clica:hover td{background:rgba(255,255,255,.022)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rolar{overflow-x:auto;margin:0 -20px;padding:0 20px}

.selo{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--haze);
  white-space:nowrap}
.selo.viva{border-color:var(--vfr);color:var(--vfr)}
.selo.ok{border-color:var(--verde);color:var(--verde)}
.selo.alerta{border-color:var(--ambar);color:var(--ambar)}
.pt{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--haze);
  margin-right:7px;vertical-align:middle}
.pt.on{background:var(--verde)}
.pt.off{background:var(--vfr)}

.msg{padding:11px 14px;font-size:.88rem;margin-bottom:12px;border:1px solid}
.msg.err{background:rgba(194,80,107,.08);border-color:rgba(194,80,107,.4);color:#E9AFBC}
.msg.ok{background:rgba(111,168,138,.08);border-color:rgba(111,168,138,.35);color:#9FD2B7}
.msg.aviso{background:rgba(200,162,74,.07);border-color:rgba(200,162,74,.34);color:#DEC48A}
.msg summary{cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;opacity:.7;margin-top:7px}
.msg pre{white-space:pre-wrap;word-break:break-word;font:10.5px/1.5 var(--mono);margin-top:5px;opacity:.75}

/* ─── níveis da rubrica ─── */
.niveis{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.niv{padding:8px 12px;border:1px solid var(--line);font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-align:left;min-width:74px;transition:all .2s}
.niv:hover{border-color:#33475C}
.niv.on{border-color:var(--vfr);background:rgba(194,80,107,.1);color:var(--chart)}
.niv b{display:block;font-size:13px;font-weight:500;margin-bottom:2px}
.niv span{display:block;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
.crit{padding:15px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit-cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.crit-cab b{font-weight:400;font-size:.97rem}
.crit-cab .meta{margin-left:auto}
.crit p{font-size:.83rem;color:var(--haze);margin-top:3px;max-width:70ch}

.membro{border:1px solid var(--line);padding:15px;margin-bottom:10px;background:var(--void)}
.membro-cab{display:flex;align-items:center;gap:12px;padding-bottom:11px;
  border-bottom:1px solid var(--line);margin-bottom:12px}
.membro-cab b{font-family:var(--mono);font-size:12px;letter-spacing:.12em}

.veu{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(4,6,10,.9);backdrop-filter:blur(8px)}
.veu.on{display:flex}
.veu-cx{width:min(680px,100%);max-height:90vh;overflow-y:auto;border:1px solid var(--line);
  background:var(--deck);padding:24px}
.vazio{padding:34px 0;text-align:center;color:#4E5F70;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase}
@media(max-width:640px){main{padding:18px var(--gut) 80px}.cx{padding:15px}.rolar{margin:0 -15px;padding:0 15px}}
</style>
</head>
<body>

<div class="topo">
  <div class="topo-l">
    <div>
      <a class="volta" href="/">&larr; Curso de Poder Aeroespacial</a>
      <span class="eyebrow">POAE 2026 · Instrutor</span>
      <div class="h1" id="tit">Painel da avaliação</div>
    </div>
    <div class="dir linha" style="margin:0" id="topoBtn"></div>
  </div>
  <div class="abas" id="abas"></div>
</div>

<main id="app"><p class="vazio">Carregando…</p></main>
<div class="veu" id="veu"><div class="veu-cx" id="veuCx"></div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://ykkgybnsdmkqewjqkhfm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aqYO6MH3-cbK9K_azQ0G0A_0jYqopbW';
/* Mesma chave de /poae-prova/index.html: o instrutor atravessa da porta do cadete
   para o painel sem relogar. E nenhuma das duas encosta na sessão anônima da sala. */
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ storageKey:'poae-prova-auth', persistSession:true, autoRefreshToken:true }
});

const app  = document.getElementById('app');
const abas = document.getElementById('abas');
const topoBtn = document.getElementById('topoBtn');
const veu  = document.getElementById('veu');
const veuCx= document.getElementById('veuCx');

const esc = s => String(s ?? '').replace(/[<>&"]/g,
  c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const num = (v, d=2) => v == null ? '—' : Number(v).toFixed(d).replace('.', ',');
const dt  = s => s ? new Date(s).toLocaleString('pt-BR') : '—';

function erro(e){
  console.error(e);
  const cru = e?.message || String(e);
  app.insertAdjacentHTML('afterbegin', `<div class="msg err">${esc(
    cru.length < 150 ? cru : 'Algo falhou.')}
    <details><summary>detalhe técnico</summary><pre>${esc(cru)}</pre></details></div>`);
}
/* persistir=true faz a mensagem sobreviver ao render() seguinte. Sem isso o
   "salvo" aparece e é apagado no mesmo quadro, porque render() zera o app. */
function ok(t, persistir){
  if (persistir){ S.recado = t; return; }
  app.insertAdjacentHTML('afterbegin', `<div class="msg ok">${esc(t)}</div>`);
  setTimeout(() => app.querySelector('.msg.ok')?.remove(), 4000);
}
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw error; return data;
}
async function sel(tab, cols, filtro){
  let q = sb.from(tab).select(cols);
  if (filtro) q = filtro(q);
  const { data, error } = await q;
  if (error) throw error; return data || [];
}
function modal(html, depois){
  veuCx.innerHTML = html; veu.classList.add('on'); depois && depois();
}
function fechar(){ veu.classList.remove('on'); veuCx.innerHTML = ''; }
veu.addEventListener('click', e => { if (e.target === veu) fechar(); });

/* CSV com BOM e ponto-e-vírgula: abre direto no Excel em português. */
function baixarCSV(nome, linhas){
  const txt = linhas.map(l => l.map(c => {
    const s = String(c ?? '').replace(/"/g,'""');
    return /[";\n]/.test(s) ? `"${s}"` : s;
  }).join(';')).join('\r\n');
  const b = new Blob(['\ufeff' + txt], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

const S = { user:null, aba:'provas', turmas:[], prova:null, trabalho:null,
            monitorId:null, recado:null, turmaSel:null };

/* ══════════════════════════════════════════════════════════════════
   PORTÃO
   ══════════════════════════════════════════════════════════════════ */
async function entrar(){
  abas.innerHTML = ''; topoBtn.innerHTML = '';
  app.innerHTML = `<div class="cx" style="max-width:420px">
    <h2>Acesso do instrutor</h2>
    <div class="campo"><label>E-mail</label><input type="email" id="m" autocomplete="username"></div>
    <div class="campo"><label>Senha</label><input type="password" id="s" autocomplete="current-password"></div>
    <div class="linha"><button class="btn solid" id="ir">Entrar</button>
      <button class="btn" id="novo">Criar conta</button></div>
    <p class="meta" style="margin-top:16px;text-transform:none;letter-spacing:.05em;line-height:1.7">
      Primeira vez: crie a conta aqui, depois rode a seção 9 da migração 08 com este
      mesmo e-mail para receber o papel de instrutor.</p>
  </div>`;

  const cred = () => ({ email: document.getElementById('m').value.trim(),
                        password: document.getElementById('s').value });
  document.getElementById('ir').onclick = async ev => {
    ev.target.disabled = true;
    try { const { error } = await sb.auth.signInWithPassword(cred());
      if (error) throw error; rotear(); }
    catch(e){ ev.target.disabled = false; erro(e); }
  };
  document.getElementById('novo').onclick = async ev => {
    ev.target.disabled = true;
    try { const { error } = await sb.auth.signUp(cred());
      if (error) throw error; rotear(); }
    catch(e){ ev.target.disabled = false; erro(e); }
  };
  document.getElementById('s').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('ir').click(); };
}

async function rotear(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return entrar();
  S.user = session.user;

  const eh = await rpc('pv_eh_instrutor');
  if (!eh){
    abas.innerHTML = '';
    topoBtn.innerHTML = `<button class="btn" id="sair">Sair</button>`;
    document.getElementById('sair').onclick = async () => {
      await sb.auth.signOut(); location.reload(); };
    app.innerHTML = `<div class="cx"><h2>Conta sem papel de instrutor</h2>
      <p class="dim">A conta <b>${esc(S.user.email)}</b> existe, mas não está em
        <code>pv_instrutor</code>. Rode no SQL Editor do Supabase:</p>
      <pre style="font:11px/1.7 var(--mono);background:var(--void);border:1px solid var(--line);
        padding:14px;margin-top:14px;overflow-x:auto;white-space:pre-wrap">insert into public.pv_instrutor (id, nome)
select u.id, 'Giovani' from auth.users u
 where lower(u.email) = lower('${esc(S.user.email)}')
on conflict (id) do nothing;</pre>
      <p class="meta" style="margin-top:12px;text-transform:none;letter-spacing:.05em">
        Depois recarregue esta página.</p></div>`;
    return;
  }

  S.turmas = await sel('pv_turma', 'id,nome,codigo,ativa', q => q.order('nome'));
  pintarAbas();
  render();
}

const ABAS = [
  ['provas','Provas'], ['questoes','Questões'], ['aplicar','Aplicar'],
  ['corrigir','Corrigir'], ['notas','Notas'], ['log','Ocorrências'],
  ['trabalhos','Trabalhos'], ['rubricas','Rubricas'], ['turmas','Turmas']
];
function pintarAbas(){
  abas.innerHTML = ABAS.map(([k,r]) =>
    `<button data-k="${k}" class="${S.aba===k?'on':''}">${r}</button>`).join('');
  abas.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    S.aba = b.dataset.k; clearInterval(S.monitorId); pintarAbas(); render(); });
  topoBtn.innerHTML = `<span class="meta">${esc(S.user.email)}</span>
    <button class="btn mini" id="sair">Sair</button>`;
  document.getElementById('sair').onclick = async () => {
    await sb.auth.signOut(); location.reload(); };
}

function render(){
  app.innerHTML = '<p class="vazio">Carregando…</p>';
  ({ provas:telaProvas, questoes:telaQuestoes, aplicar:telaAplicar,
     corrigir:telaCorrigir, notas:telaNotas, log:telaLog,
     trabalhos:telaTrabalhos, rubricas:telaRubricas, turmas:telaTurmas
   })[S.aba]()
   .then(() => { if (S.recado){ const t = S.recado; S.recado = null; ok(t); } })
   .catch(erro);
}
const optTurmas = (sel_) => S.turmas.map(t =>
  `<option value="${t.id}" ${sel_===t.id?'selected':''}>${esc(t.nome)}</option>`).join('');

/* ══════════════════════════════════════════════════════════════════
   PROVAS
   ══════════════════════════════════════════════════════════════════ */
async function telaProvas(){
  const ps = await sel('pv_prova', '*', q => q.order('criada_em', { ascending:false }));
  const mapa = Object.fromEntries(S.turmas.map(t => [t.id, t.nome]));
  app.innerHTML = `
    <div class="cx"><h2>Nova prova</h2>
      <div class="grade g2">
        <div><label>Turma</label><select id="nt">${optTurmas()}</select></div>
        <div><label>Título</label><input id="ntit" placeholder="1ª Avaliação Parcial"></div>
        <div><label>Duração (min)</label><input type="number" id="ndur" value="60"></div>
        <div><label>Nota máxima</label><input type="number" id="nmax" value="10" step="0.5"></div>
      </div>
      <div class="linha"><button class="btn solid" id="criar">Criar prova</button></div>
    </div>

    <div class="cx"><h2>Provas (${ps.length})</h2>
    ${ps.length ? `<div class="rolar"><table><thead><tr>
      <th>Título</th><th>Turma</th><th>Estado</th><th>Duração</th><th>Nota</th><th>Encerra</th>
    </tr></thead><tbody>${ps.map(p => `
      <tr class="clica" data-id="${p.id}">
        <td><b style="font-weight:400">${esc(p.titulo)}</b></td>
        <td class="dim">${esc(mapa[p.turma_id]||'—')}</td>
        <td><span class="selo ${p.estado==='liberada'?'viva':p.estado==='publicada'?'ok':''}">${p.estado}</span></td>
        <td class="num dim">${p.duracao_min} min</td>
        <td class="num dim">${num(p.nota_maxima,1)}</td>
        <td class="num dim">${dt(p.encerra_em)}</td>
      </tr>`).join('')}</tbody></table></div>` : `<p class="vazio">Nenhuma prova ainda</p>`}
    </div>`;

  document.getElementById('criar').onclick = async ev => {
    const tit = document.getElementById('ntit').value.trim();
    if (!tit) return erro(new Error('Informe o título.'));
    ev.target.disabled = true;
    try {
      const { error } = await sb.from('pv_prova').insert({
        turma_id: document.getElementById('nt').value, titulo: tit,
        duracao_min: +document.getElementById('ndur').value || 60,
        nota_maxima: +document.getElementById('nmax').value || 10 });
      if (error) throw error;
      ok('Prova criada.'); telaProvas();
    } catch(e){ ev.target.disabled = false; erro(e); }
  };
  app.querySelectorAll('tr[data-id]').forEach(tr =>
    tr.onclick = () => editarProva(ps.find(p => p.id === tr.dataset.id)));
}

function editarProva(p){
  const trava = !['rascunho','selada'].includes(p.estado);
  modal(`<h3 class="h3" style="margin-bottom:16px">${esc(p.titulo)}</h3>
    ${trava ? `<div class="msg aviso">Prova já liberada — só instruções e nota máxima
      continuam editáveis.</div>` : ''}
    <div class="grade g2">

function editarQuestao(q, ordem){
  const novo = !q;
  const alts = q?.alternativas || [{id:'a',texto:''},{id:'b',texto:''},{id:'c',texto:''},{id:'d',texto:''}];
  modal(`<h3 class="h3" style="margin-bottom:16px">${novo?'Nova questão':'Questão '+q.ordem}</h3>
    <div class="grade g3">
      <div><label>Ordem</label><input type="number" id="q_ord" value="${q?.ordem ?? ordem}"></div>
      <div><label>Tipo</label><select id="q_tipo">
        <option value="objetiva" ${q?.tipo==='objetiva'?'selected':''}>Objetiva</option>
        <option value="aberta" ${q?.tipo==='aberta'?'selected':''}>Dissertativa</option></select></div>
      <div><label>Peso</label><input type="number" id="q_peso" step="0.25" value="${q?.peso ?? 1}"></div>
    </div>
    <div class="campo" style="margin-top:12px"><label>Enunciado</label>
      <textarea id="q_en">${esc(q?.enunciado||'')}</textarea></div>
    <div id="q_obj"><label>Alternativas · marque o gabarito</label><div id="q_alts"></div>
      <button class="btn mini" id="q_add" style="margin-top:8px">Acrescentar alternativa</button></div>
    <div id="q_ab">
      <div class="campo"><label>Resposta esperada (gabarito)</label>
        <textarea id="q_gab">${esc(q && q.tipo==='aberta' ? (q.gabarito||'') : '')}</textarea></div>
      <div class="campo"><label>Critérios ponderados — um por linha</label>
        <textarea id="q_cri" placeholder="1.5 · negação; negação estratégica; destruir a capacidade militar&#10;1.0 · Pape; coerção&#10;1.5 · interdição; logística">${esc(q?.criterio||'')}</textarea>
        <p class="meta" style="margin-top:6px;text-transform:none;letter-spacing:.04em;line-height:1.6">
          Formato: <b>peso · termo; sinônimo; sinônimo</b>. Na correção o sistema procura os
          termos na resposta e propõe a nota. A proposta nunca é publicada sem seu clique.</p></div>
    </div>
    <div class="linha"><button class="btn" id="x">Cancelar</button>
      <span class="dir"><button class="btn solid" id="sv">Salvar questão</button></span></div>`,
  () => {
    const cxAlts = document.getElementById('q_alts');
    let lista = alts.map(a => ({...a}));
    let gab = q?.gabarito || 'a';
    const pintar = () => {
      cxAlts.innerHTML = lista.map((a,i) => `
        <div class="linha" style="margin-top:7px;flex-wrap:nowrap">
          <button class="btn mini ${gab===a.id?'solid':''}" data-g="${a.id}"
            style="min-width:38px;justify-content:center">${esc(a.id.toUpperCase())}</button>
          <input data-a="${a.id}" value="${esc(a.texto)}" placeholder="texto da alternativa">
          <button class="btn mini" data-rm="${a.id}">×</button></div>`).join('');
      cxAlts.querySelectorAll('[data-g]').forEach(b =>
        b.onclick = () => { gab = b.dataset.g; pintar(); });
      cxAlts.querySelectorAll('[data-a]').forEach(inp =>
        inp.oninput = () => { lista.find(x => x.id === inp.dataset.a).texto = inp.value; });
      cxAlts.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
        if (lista.length <= 2) return;
        lista = lista.filter(x => x.id !== b.dataset.rm);
        if (gab === b.dataset.rm) gab = lista[0].id; pintar(); });
    };
    pintar();
    document.getElementById('q_add').onclick = () => {
      const prox = 'abcdefgh'.split('').find(l => !lista.some(x => x.id === l));
      if (prox){ lista.push({ id:prox, texto:'' }); pintar(); }
    };
    const alternar = () => {
      const t = document.getElementById('q_tipo').value;
      document.getElementById('q_obj').style.display = t === 'objetiva' ? '' : 'none';
      document.getElementById('q_ab').style.display  = t === 'aberta' ? '' : 'none';
    };
    document.getElementById('q_tipo').onchange = alternar; alternar();

    document.getElementById('x').onclick = fechar;
    document.getElementById('sv').onclick = async ev => {
      const tipo = document.getElementById('q_tipo').value;
      const en = document.getElementById('q_en').value.trim();
      if (!en) return erro(new Error('Enunciado vazio.'));
      if (tipo === 'objetiva' && lista.some(a => !a.texto.trim()))
        return erro(new Error('Há alternativa sem texto.'));
      ev.target.disabled = true;
      try {
        await rpc('pv_salvar_questao', {
          p_id: q?.id ?? null, p_prova: S.prova,
          p_ordem: +document.getElementById('q_ord').value,
          p_tipo: tipo, p_enunciado: en,
          p_peso: +document.getElementById('q_peso').value || 1,
          p_alternativas: tipo === 'objetiva' ? lista : null,
          p_gabarito: tipo === 'objetiva' ? gab : document.getElementById('q_gab').value,
          p_criterio: tipo === 'aberta' ? document.getElementById('q_cri').value : null });
        fechar(); ok('Questão salva.'); render();
      } catch(e){ ev.target.disabled = false; erro(e); }
    };
  });
}

/* ══════════════════════════════════════════════════════════════════
   CORRIGIR — por questão, com proposta pelos critérios
   ══════════════════════════════════════════════════════════════════ */
function normalizar(t){
  return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function propor(criterio, resposta, peso){
  const linhas = String(criterio||'').split('\n').map(l => l.trim()).filter(Boolean);
  if (!linhas.length) return null;
  const alvo = normalizar(resposta);
  let total = 0, obtido = 0;
  const achados = linhas.map(l => {
    const [pRaw, termosRaw] = l.split('·');
    const p = parseFloat(String(pRaw).replace(',','.')) || 1;
    const termos = (termosRaw||'').split(';').map(t => t.trim()).filter(Boolean);
    const hit = termos.find(t => alvo.includes(normalizar(t)));
    total += p; if (hit) obtido += p;
    return { peso:p, termos, hit: hit || null };
  });
  return { nota: total ? +(obtido / total * peso).toFixed(2) : null, achados, total, obtido };
}

async function corrigirQuestao(q){
  const linhas = await rpc('pv_respostas_da_questao', { p_questao:q.id, p_cega:false });
  const props = linhas.map(l => propor(q.criterio, l.resposta, Number(q.peso)));

  app.innerHTML = `<div class="cx"><div class="linha" style="margin:0">
      <button class="btn" id="volta">← Voltar</button>
      <span class="dir linha" style="margin:0">
        ${q.criterio ? `<button class="btn" id="aceitar">Aceitar todas as propostas</button>` : ''}
        <button class="btn solid" id="salvar">Salvar notas</button></span></div>
    <h2 style="margin-top:16px">Questão ${q.ordem} · peso ${num(q.peso,2)} · ${linhas.length} respostas</h2>
    <p style="white-space:pre-wrap;font-size:.92rem">${esc(q.enunciado)}</p>
    ${q.gabarito ? `<div style="margin-top:10px;padding:10px 12px;border-left:1px solid var(--verde);font-size:.85rem;white-space:pre-wrap">${esc(q.gabarito)}</div>` : ''}
    ${q.criterio ? `<div style="margin-top:8px;padding:10px 12px;border-left:1px solid var(--ambar);font:11px/1.7 var(--mono);color:#DEC48A;white-space:pre-wrap">${esc(q.criterio)}</div>` : ''}
    </div>
    ${linhas.map((l,i) => `
      <div class="cx">
        <div class="crit-cab" style="margin-bottom:10px">
          <b>${esc(l.aluno || 'Cadete ' + (i+1))}</b>
          ${props[i] ? `<span class="selo alerta">proposta ${num(props[i].nota,2)}</span>` : ''}
          <span class="dir linha" style="margin:0">
            <input type="number" step="0.25" min="0" max="${q.peso}" data-nota="${l.tentativa}"
              value="${l.nota ?? ''}" style="width:92px;text-align:center"></span>
        </div>
        <div style="white-space:pre-wrap;font-size:.9rem;padding:12px 14px;border-left:1px solid var(--azimuth)">${esc(l.resposta || '— em branco —')}</div>
        ${props[i] ? `<div class="linha" style="margin-top:9px;gap:6px">${props[i].achados.map(a =>
          `<span class="selo ${a.hit?'ok':''}" title="${esc(a.termos.join('; '))}">${a.hit ? '✓ ' + esc(a.hit) : '✗ ' + esc(a.termos[0]||'')} · ${num(a.peso,1)}</span>`).join('')}</div>` : ''}
        <div class="campo" style="margin-top:10px"><label>Comentário ao cadete</label>

/* ══════════════════════════════════════════════════════════════════
   TRABALHOS EM GRUPO

   Regra de composição da nota, única em todo o módulo:

     nota_rubrica = Σ(valor × peso) ÷ Σ(teto × peso)          → fração 0..1
     bruta        = (grupo×peso_grupo + indiv×peso_indiv)/100 × nota_maxima
     final        = bruta − desconto, presa entre 0 e nota_maxima

   Se um dos lados não tem rubrica configurada, o outro responde por 100% —
   senão o cadete levaria metade da nota por uma avaliação que não existe.
   ══════════════════════════════════════════════════════════════════ */

/* Fração 0..1 de uma rubrica. valorDe(criterio) devolve o nível escolhido ou null. */
function notaRubrica(criterios, valorDe){
  if (!criterios || !criterios.length) return { tem:false, frac:null, faltam:0 };
  var obt = 0, teto = 0, faltam = 0;
  criterios.forEach(function(c){
    var tc = Math.max.apply(null, [0].concat((c.niveis||[]).map(function(n){
      return Number(n.valor) || 0; })));
    teto += tc * Number(c.peso);
    var v = valorDe(c);
    if (v == null) faltam++; else obt += Number(v) * Number(c.peso);
  });
  return { tem:true, frac: teto ? obt / teto : null, faltam:faltam };
}

/* Nota final de um membro. Recebe o detalhe do trabalho e as seleções correntes. */
function notaMembro(t, criteriosG, criteriosI, valorG, valorI, desconto){
  var g = notaRubrica(criteriosG, valorG);
  var i = notaRubrica(criteriosI, valorI);
  if (!g.tem && !i.tem) return null;
  var pg = Number(t.peso_grupo) || 0, pi = Number(t.peso_individual) || 0;
  if (!g.tem){ pg = 0; pi = 100; }
  if (!i.tem){ pg = 100; pi = 0; }
  var nm = Number(t.nota_maxima) || 10;
  var ng = g.frac == null ? 0 : g.frac * nm;
  var ni = i.frac == null ? 0 : i.frac * nm;
  var bruta = (ng * pg + ni * pi) / 100;
  var desc = Number(desconto) || 0;
  return {
    notaG: g.tem ? ng : null, notaI: i.tem ? ni : null,
    pesoG: pg, pesoI: pi, bruta: bruta, desconto: desc,
    final: Math.max(0, Math.min(nm, bruta - desc)),
    nmax: nm, faltamG: g.faltam, faltamI: i.faltam,
    completo: g.faltam === 0 && i.faltam === 0
  };
}

/* Mesma conta, a partir do retorno cru de pv_trabalho_detalhe (sem UI no meio).
   Usada pela lista, pelo CSV e pelo relatório. */
function notasDoDetalhe(d){
  var t = d.trabalho;
  var vg = {}; (d.criterios_grupo||[]).forEach(function(c){
    if (c.valor != null) vg[c.id] = Number(c.valor); });
  var grupo = notaRubrica(d.criterios_grupo, function(c){
    return vg[c.id] == null ? null : vg[c.id]; });
  var nm = Number(t.nota_maxima) || 10;
  var membros = (d.membros||[]).map(function(m){
    var n = notaMembro(t, d.criterios_grupo, d.criterios_individual,
      function(c){ return vg[c.id] == null ? null : vg[c.id]; },
      function(c){ var x = (m.notas||{})[c.id]; return x == null ? null : Number(x.valor); },
      m.desconto);
    return { aluno_id:m.aluno_id, nome_guerra:m.nome_guerra,
             desconto:Number(m.desconto)||0, motivo:m.motivo_desconto||'', n:n };
  });
  return { notaGrupo: grupo.tem && grupo.frac != null ? grupo.frac * nm : null,
           faltamGrupo: grupo.faltam, nmax:nm, membros:membros };
}

/* ─── lista de trabalhos da turma ───────────────────────────────────── */
async function telaTrabalhos(){
  if (S.trabalho) return avaliarTrabalho(S.trabalho);
  const turma = S.turmaSel || S.turmas[0]?.id;
  S.turmaSel = turma;
  if (!turma) return app.innerHTML = `<p class="vazio">Nenhuma turma cadastrada</p>`;
  const nomeTurma = S.turmas.find(x => x.id === turma)?.nome || '';

  const ts = await sel('pv_trabalho', '*', q => q.eq('turma_id', turma).order('numero'));

  app.innerHTML = `<div class="cx"><div class="linha" style="margin:0">
      <div style="flex:1;min-width:200px"><label>Turma</label>
        <select id="st">${optTurmas(turma)}</select></div>
      <button class="btn" id="novo">Novo trabalho</button></div>
    <div class="linha"><button class="btn" id="pdf">Relatório em PDF</button>
      <button class="btn" id="csv">CSV de notas</button>
      <span class="prog dir" id="prog"></span></div>
    <p class="meta" style="margin-top:12px">${ts.length} trabalhos · temas e aulas conforme o PLADIS</p></div>
    <div class="cx"><div id="lista"><p class="vazio">Carregando notas…</p></div></div>
    <div class="cx"><h2>Notas por cadete</h2><div id="porCadete">
      <p class="vazio">Carregando…</p></div></div>`;

  document.getElementById('st').onchange = e => { S.turmaSel = e.target.value; render(); };

  /* Uma chamada de detalhe por trabalho. É o preço de não duplicar a regra de
     cálculo no banco — a conta mora num lugar só, aqui em cima. */
  const prog = document.getElementById('prog');
  const dets = [];
  for (let k = 0; k < ts.length; k++){
    prog.textContent = `lendo avaliações ${k+1}/${ts.length}`;
    try { dets.push(await rpc('pv_trabalho_detalhe', { p_trabalho: ts[k].id })); }
    catch(e){ dets.push(null); }
  }
  prog.textContent = '';
  S.detsTurma = { turma:turma, nome:nomeTurma, ts:ts, dets:dets };

  const calc = dets.map(d => d ? notasDoDetalhe(d) : null);

  document.getElementById('lista').innerHTML = ts.length ? `<div class="rolar"><table><thead><tr>
      <th>#</th><th>Aula</th><th>Tema</th><th>Membros</th><th>Nota do grupo</th>
      <th>Estado</th><th></th></tr></thead><tbody>
      ${ts.map((t, k) => {
        const c = calc[k];
        const nota = c && c.notaGrupo != null
          ? `<span class="nota-fw">${num(c.notaGrupo,2)}</span>
             <span class="dim" style="font-size:.8rem"> / ${num(c.nmax,1)}</span>${
             c.faltamGrupo ? ` <span class="selo alerta">${c.faltamGrupo} sem nota</span>` : ''}`
          : '<span class="dim">—</span>';
        return `<tr>
          <td class="num clica" data-t="${t.id}"><b style="font-weight:500">${t.numero}</b></td>
          <td class="num dim clica" data-t="${t.id}">${t.aula ?? '—'}</td>
          <td class="clica" data-t="${t.id}" style="max-width:430px;font-size:.87rem">${esc(t.tema)}</td>
          <td class="num clica" data-t="${t.id}">${c ? c.membros.length : 0}</td>
          <td class="num">${nota}</td>
          <td><span class="selo ${t.estado==='publicado'?'ok':t.estado==='avaliado'?'alerta':''}">${t.estado}</span></td>
          <td><button class="btn mini" data-ed="${t.id}">Editar</button></td>
        </tr>`;
      }).join('')}</tbody></table></div>`
    : `<p class="vazio">Nenhum trabalho nesta turma</p>`;

  /* tabela achatada: um cadete por linha, com a decomposição da nota */
  const linhas = [];
  ts.forEach((t, k) => {
    const c = calc[k]; if (!c) return;
    c.membros.forEach(m => linhas.push({ t:t, c:c, m:m }));
  });
  document.getElementById('porCadete').innerHTML = linhas.length
    ? `<div class="rolar"><table><thead><tr><th>Cadete</th><th>Grupo</th><th>Tema</th>
        <th>Grupo</th><th>Individual</th><th>Desconto</th><th>Nota final</th>
        </tr></thead><tbody>
        ${linhas.map(l => `<tr>
          <td>${esc(l.m.nome_guerra)}</td>
          <td class="num dim">${l.t.numero}</td>
          <td class="dim" style="max-width:300px;font-size:.82rem">${esc(l.t.tema)}</td>
          <td class="num dim">${l.m.n && l.m.n.notaG != null ? num(l.m.n.notaG,2) : '—'}</td>
          <td class="num dim">${l.m.n && l.m.n.notaI != null ? num(l.m.n.notaI,2) : '—'}</td>
          <td class="num ${l.m.desconto ? '' : 'dim'}">${l.m.desconto ? '−'+num(l.m.desconto,2) : '—'}</td>
          <td class="num"><b class="nota-fw" style="font-weight:500">${
            l.m.n ? num(l.m.n.final,2) : '—'}</b>${
            l.m.n && !l.m.n.completo ? ' <span class="selo alerta">parcial</span>' : ''}</td>
        </tr>`).join('')}</tbody></table></div>

          "Parcial" = ainda há critério sem nível marcado; o valor mostrado conta o que
          falta como zero.</p>`
    : `<p class="vazio">Nenhum cadete alocado em trabalhos desta turma</p>`;

  app.querySelectorAll('.clica[data-t]').forEach(el =>
    el.onclick = () => { S.trabalho = el.dataset.t; render(); });
  app.querySelectorAll('[data-ed]').forEach(b =>
    b.onclick = () => editarTrabalho(ts.find(x => x.id === b.dataset.ed)));
  document.getElementById('novo').onclick = () => editarTrabalho(null, turma, ts);
  document.getElementById('csv').onclick = () => csvTrabalhos(nomeTurma, ts, calc);
  document.getElementById('pdf').onclick = () => relatorioTrabalhos(nomeTurma, ts, calc);
}

/* ─── criar / editar / excluir trabalho ─────────────────────────────
   O TEMA É DO CURSO, O GRUPO É DA TURMA. Editar o tema do Grupo 1 na Turma D
   reescreve o Grupo 1 das seis turmas — é o mesmo caso histórico apresentado por
   times diferentes. Número e estado continuam locais, senão a renumeração de uma
   turma bagunçaria o alinhamento das outras.
   ─────────────────────────────────────────────────────────────────── */
function editarTrabalho(t, turmaId, existentes){
  const novo = !t;
  const prox = novo ? (Math.max(0, ...(existentes||[]).map(x => +x.numero || 0)) + 1) : t.numero;
  modal(`<h2>${novo ? 'Novo trabalho' : 'Trabalho ' + t.numero}</h2>
    <div class="grade g2">
      <div class="campo"><label>Número do grupo</label>
        <input type="number" id="tn" min="1" value="${prox}"></div>
      <div class="campo"><label>Aula</label>
        <input type="number" id="ta" min="1" max="18" value="${novo ? '' : (t.aula ?? '')}"></div>
    </div>
    <div class="campo"><label>Tema</label><textarea id="tt" rows="3">${
      novo ? '' : esc(t.tema)}</textarea></div>
    ${novo ? '' : `<div class="campo"><label>Estado</label><select id="te">
      ${['rascunho','avaliado','publicado'].map(x =>
        `<option value="${x}" ${t.estado===x?'selected':''}>${x}</option>`).join('')}
      </select></div>`}
    ${novo ? `<label class="opt"><input type="checkbox" id="todas" checked>
      <span>Criar este grupo em todas as ${S.turmas.length} turmas</span></label>` : ''}
    <div class="linha"><button class="btn solid" id="sv">${novo?'Criar':'Salvar'}</button>
      <button class="btn" id="cc">Cancelar</button>
      ${novo ? '' : `<span class="dir"><button class="btn mini" id="xx"
        style="border-color:rgba(194,80,107,.5);color:var(--vfr)">Excluir trabalho</button></span>`}</div>
    <p class="meta" style="margin-top:14px;text-transform:none;letter-spacing:.04em;line-height:1.7">
      ${novo
        ? 'O trabalho nasce sem rubrica e sem membros. Abra-o depois para configurar.'
        : 'Tema e aula valem para o curso inteiro: salvar aqui reescreve o Grupo ' +
          t.numero + ' das outras turmas e o programa do site. Número e estado ficam só nesta turma.'}</p>`);

  document.getElementById('cc').onclick = fechar;
  document.getElementById('sv').onclick = async ev => {
    const tema = document.getElementById('tt').value.trim();
    const aula = document.getElementById('ta').value ? +document.getElementById('ta').value : null;
    const numero = +document.getElementById('tn').value || 1;
    if (!tema) return erro(new Error('O tema não pode ficar vazio.'));
    ev.target.disabled = true;
    try {
      if (novo){
        const todas = document.getElementById('todas').checked;
        const alvos = todas ? S.turmas.map(x => x.id) : [turmaId];
        const { error } = await sb.from('pv_trabalho').insert(alvos.map(tid =>
          ({ turma_id:tid, estado:'rascunho', numero:numero, aula:aula, tema:tema })));
        if (error) throw error;
        fechar(); ok(todas ? `Grupo ${numero} criado nas ${alvos.length} turmas.`
                           : `Grupo ${numero} criado.`, true);
      } else {
        /* 1º propaga o que é do curso, pelo número ORIGINAL */
        const e1 = await sb.from('pv_trabalho').update({ tema:tema, aula:aula })
          .eq('numero', t.numero);
        if (e1.error) throw e1.error;
        /* 2º o que é só desta turma */
        const e2 = await sb.from('pv_trabalho')
          .update({ numero:numero, estado:document.getElementById('te').value })
          .eq('id', t.id);
        if (e2.error) throw e2.error;
        fechar(); ok('Tema salvo nas turmas que têm o Grupo ' + t.numero + '.', true);
      }
      render();
    } catch(e){ ev.target.disabled = false; erro(e); }
  };

  if (!novo) document.getElementById('xx').onclick = async ev => {
    if (!confirm(`Excluir o Grupo ${t.numero} SOMENTE desta turma?\n\n` +
      `Some a avaliação, os membros e as notas deste grupo. As outras turmas ficam.`)) return;
    ev.target.disabled = true;
    try {
      await sb.from('pv_trabalho_membro').delete().eq('trabalho_id', t.id);
      const { error } = await sb.from('pv_trabalho').delete().eq('id', t.id);
      if (error) throw error;
      fechar(); ok('Trabalho excluído.', true); render();
    } catch(e){
      ev.target.disabled = false;
      erro(new Error('Não excluiu — há notas salvas apontando para este trabalho. ' +
        'Exclua a avaliação primeiro, dentro do trabalho.'));
    }
  };
}

/* ─── CSV ───────────────────────────────────────────────────────────── */
function csvTrabalhos(nomeTurma, ts, calc){
  const linhas = [['Nome de guerra','Turma','Grupo','Tema','Nota do grupo',
                   'Nota individual','Desconto','Nota final','Completo']];
  ts.forEach((t, k) => {
    const c = calc[k]; if (!c) return;
    c.membros.forEach(m => linhas.push([
      m.nome_guerra, nomeTurma, t.numero, t.tema,
      m.n && m.n.notaG != null ? num(m.n.notaG,2) : '',
      m.n && m.n.notaI != null ? num(m.n.notaI,2) : '',
      m.desconto ? num(m.desconto,2) : '0,00',
      m.n ? num(m.n.final,2) : '',
      m.n && m.n.completo ? 'sim' : 'não']));
  });
  if (linhas.length === 1) return erro(new Error('Nenhuma nota para exportar.'));
  baixarCSV(`notas-trabalhos-${nomeTurma.replace(/\s+/g,'-').toLowerCase()}.csv`, linhas);
}

/* ─── avaliação de um grupo ─────────────────────────────────────────── */

  const d = await rpc('pv_trabalho_detalhe', { p_trabalho:id });

  const alunos = await sel('pv_aluno', 'id,nome_guerra', q =>
    q.eq('turma_id', t.turma_id).order('nome_guerra'));
  const jaMembro = new Set(d.membros.map(m => m.aluno_id));

  const optRub = (esc_, v) => `<option value="">— nenhuma —</option>` + rubs
    .filter(r => r.escopo === esc_)
    .map(r => `<option value="${r.id}" ${v===r.id?'selected':''}>${esc(r.titulo)}</option>`).join('');

  const blocoCrit = (c, escopoIndiv, alunoId) => `

          ? d.membros.find(m => m.aluno_id === alunoId)?.notas?.[c.id]?.valor

        return `<button class="niv ${Number(atual) === Number(n.valor) ? 'on':''}"

  app.innerHTML = `

      </div>
      <div class="linha"><button class="btn mini" id="salvarCfg">Aplicar configuração</button>
        <span class="meta">Os pesos precisam somar 100</span></div>

    <div class="cx"><h2>Apresentação do grupo
      <span class="dir" id="totG" style="float:right;font-family:var(--mono);font-size:12px;
        letter-spacing:.1em;color:var(--vfr)"></span></h2>
      ${d.criterios_grupo.length ? d.criterios_grupo.map(c => blocoCrit(c, false)).join('')
        : `<p class="vazio">Escolha uma rubrica de grupo acima</p>`}
      <div class="campo" style="margin-top:14px"><label>Observação geral ao grupo</label>
        <textarea id="obs">${esc(t.observacao||'')}</textarea></div>
    </div>

    ${d.criterios_individual.length && d.membros.length ? d.membros.map(m => `
      <div class="membro"><div class="membro-cab"><b>${esc(m.nome_guerra)}</b>
        <span class="meta dir">desempenho individual
          <button class="btn mini" data-limpa="${m.aluno_id}"
            style="margin-left:10px">Limpar</button></span></div>
        ${d.criterios_individual.map(c => blocoCrit(c, true, m.aluno_id)).join('')}
      </div>`).join('')
      : d.membros.length ? `<div class="cx"><p class="vazio">Escolha uma rubrica individual acima</p></div>` : ''}`;

  /* seleção de níveis */
  const sel_g = {}, sel_i = {};
  d.criterios_grupo.forEach(c => { if (c.valor != null) sel_g[c.id] = Number(c.valor); });
  d.membros.forEach(m => Object.entries(m.notas || {}).forEach(([cid, v]) => {
    sel_i[m.aluno_id + '|' + cid] = Number(v.valor); }));

  const descontoDe = aluno => {
    const i = app.querySelector(`[data-desc="${aluno}"]`);
    return i ? Number(i.value) || 0 : 0;
  };
  const calcMembro = m => notaMembro(t, d.criterios_grupo, d.criterios_individual,
    c => sel_g[c.id] == null ? null : sel_g[c.id],
    c => { const v = sel_i[m.aluno_id + '|' + c.id]; return v == null ? null : v; },
    descontoDe(m.aluno_id));

  function totalGrupo(){
    const r = notaRubrica(d.criterios_grupo, c => sel_g[c.id] == null ? null : sel_g[c.id]);
    return r.tem && r.frac != null ? r.frac * (Number(t.nota_maxima) || 10) : null;
  }

  /* O placar. Recalcula a cada clique de nível e a cada tecla no desconto —
     a nota que o cadete vai receber nunca fica escondida atrás de um "salvar". */
  function pintarPlacar(){
    const el = document.getElementById('placar');
    if (!el) return;
    if (!d.membros.length){
      el.innerHTML = `<h2>Nota final por cadete</h2>
        <div class="sub">inclua os membros do grupo para ver a composição</div>`;
      return;
    }
    const semG = !d.criterios_grupo.length, semI = !d.criterios_individual.length;
    el.innerHTML = `<h2>Nota final por cadete</h2>
      <div class="sub">${
        semG && semI ? 'nenhuma rubrica escolhida'
        : semI ? `só rubrica de grupo — vale 100% da nota`
        : semG ? `só rubrica individual — vale 100% da nota`
        : `grupo ${t.peso_grupo}% · individual ${t.peso_individual}% · máx ${num(t.nota_maxima,1)}`
      }</div>
      <div class="pl-grade">${d.membros.map(m => {
        const n = calcMembro(m);
        if (!n) return `<div class="pl-card"><div class="pl-nome">${esc(m.nome_guerra)}</div>
          <div class="dim" style="font-size:.85rem">sem rubrica configurada</div></div>`;
        const parcial = !n.completo;
        return `<div class="pl-card">
          <div class="pl-nome"><span>${esc(m.nome_guerra)}</span>
            <span class="pl-max">/ ${num(n.nmax,1)}</span></div>
          <div class="pl-nota ${parcial?'parcial':''}">${num(n.final,2)}</div>
          <div class="pl-conta">
            ${n.notaG != null ? `Grupo (${n.pesoG}%) <i>${num(n.notaG,2)}</i><br>` : ''}
            ${n.notaI != null ? `Individual (${n.pesoI}%) <i>${num(n.notaI,2)}</i><br>` : ''}
            Subtotal <i>${num(n.bruta,2)}</i>
            ${n.desconto ? `<br>Desconto <i>−${num(n.desconto,2)}</i>` : ''}
          </div>
          ${parcial ? `<div class="pl-alerta">parcial · ${
            [n.faltamG ? n.faltamG + ' do grupo' : null,
             n.faltamI ? n.faltamI + ' individual' : null]
            .filter(Boolean).join(' e ')} sem nível marcado</div>` : ''}
        </div>`;
      }).join('')}</div>`;
  }

  function pintarTotal(){
    const el = document.getElementById('totG');
    if (el){
      const v = totalGrupo();
      const faltam = d.criterios_grupo.filter(c => sel_g[c.id] == null).length;
      el.textContent = v == null ? ''
        : `${num(v,2)} / ${num(t.nota_maxima,1)}${faltam ? ` · ${faltam} sem nota` : ''}`;
    }
    pintarPlacar();
  }

  app.querySelectorAll('.niv[data-crit]').forEach(b => b.onclick = () => {
    const grupo = b.dataset.grupo === '1';
    const chave = grupo ? b.dataset.crit : b.dataset.aluno + '|' + b.dataset.crit;
    const alvo = grupo ? sel_g : sel_i;
    const val = Number(b.dataset.val);
    if (alvo[chave] === val) delete alvo[chave]; else alvo[chave] = val;
    const irmaos = grupo
      ? app.querySelectorAll(`.niv[data-grupo="1"][data-crit="${b.dataset.crit}"]`)
      : app.querySelectorAll(`.niv[data-aluno="${b.dataset.aluno}"][data-crit="${b.dataset.crit}"]`);
    irmaos.forEach(x => x.classList.remove('on'));
    if (alvo[chave] != null) b.classList.add('on');
    pintarTotal();
  });
  app.querySelectorAll('[data-desc]').forEach(i => i.oninput = pintarPlacar);
  app.querySelectorAll('[data-limpa]').forEach(b => b.onclick = () => {
    const al = b.dataset.limpa;
    Object.keys(sel_i).forEach(k => { if (k.indexOf(al + '|') === 0) delete sel_i[k]; });
    app.querySelectorAll(`.niv[data-aluno="${al}"]`).forEach(x => x.classList.remove('on'));
    pintarTotal();
    ok('Níveis limpos na tela. Clique em "Salvar avaliação" para gravar.');
  });
  pintarTotal();

  document.getElementById('volta').onclick = () => { S.trabalho = null; render(); };
  document.getElementById('salvarCfg').onclick = async ev => {
    const pg = +document.getElementById('pg').value, pi = +document.getElementById('pi').value;
    if (pg + pi !== 100) return erro(new Error('Os pesos precisam somar 100.'));
    ev.target.disabled = true;
    try { const { error } = await sb.from('pv_trabalho').update({
        rubrica_grupo: document.getElementById('rg').value || null,
        rubrica_individual: document.getElementById('ri').value || null,
        peso_grupo:pg, peso_individual:pi,
        nota_maxima:+document.getElementById('nm').value || 10,
        data_apresentacao: document.getElementById('da').value || null }).eq('id', id);
      if (error) throw error; ok('Configuração aplicada.'); render(); }
    catch(e){ ev.target.disabled = false; erro(e); }
  };
  document.getElementById('add').onclick = async () => {
    const a = document.getElementById('addAl').value;
    if (!a) return;
    try { const { error } = await sb.from('pv_trabalho_membro')
        .insert({ trabalho_id:id, aluno_id:a });
      if (error) throw error; render(); } catch(e){ erro(e); }
  };
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    try { const { error } = await sb.from('pv_trabalho_membro').delete()
        .eq('trabalho_id', id).eq('aluno_id', b.dataset.rm);
      if (error) throw error; render(); } catch(e){ erro(e); }
  });

  /* Excluir avaliação: grava vazio e CONFERE se o banco realmente apagou.
     Se a RPC só inserir, o retorno denuncia — melhor um erro claro agora do que
     uma nota fantasma no boletim. */
  document.getElementById('limpar').onclick = async ev => {
    if (!confirm('Excluir a avaliação salva deste grupo?\n\n' +
      'Apaga os níveis do grupo e os individuais de todos os membros. ' +
      'Descontos e observação continuam.')) return;
    ev.target.disabled = true;
    try {
      await rpc('pv_salvar_avaliacao', { p_trabalho:id, p_grupo:[], p_individual:[] });
      const v = await rpc('pv_trabalho_detalhe', { p_trabalho:id });
      const sobrouG = (v.criterios_grupo||[]).some(c => c.valor != null);
      const sobrouI = (v.membros||[]).some(m => Object.keys(m.notas||{}).length);
      if (sobrouG || sobrouI){
        erro(new Error('Não apagou: pv_salvar_avaliacao só acrescenta notas. ' +
          'Precisa de migração no banco para excluir.'));
        ev.target.disabled = false; return;
      }
      ok('Avaliação excluída.', true); render();
    } catch(e){ ev.target.disabled = false; erro(e); }
  };

  document.getElementById('salvar').onclick = async ev => {
    ev.target.disabled = true;
    try {
      await sb.from('pv_trabalho').update({ observacao: document.getElementById('obs').value })
        .eq('id', id);
      for (const inp of app.querySelectorAll('[data-desc]')){
        const al = inp.dataset.desc;
        const mot = app.querySelector(`[data-mot="${al}"]`);
        const { error } = await sb.from('pv_trabalho_membro')
          .update({ desconto: Number(inp.value) || 0, motivo_desconto: mot?.value || null })
          .eq('trabalho_id', id).eq('aluno_id', al);
        if (error) throw error;
      }
      await rpc('pv_salvar_avaliacao', { p_trabalho:id,
        p_grupo: Object.entries(sel_g).map(([c,v]) => ({ criterio:c, valor:v })),
        p_individual: Object.entries(sel_i).map(([k,v]) => {
          const [aluno, criterio] = k.split('|'); return { aluno, criterio, valor:v }; }) });
      ok('Avaliação salva.'); ev.target.disabled = false;
    } catch(e){ ev.target.disabled = false; erro(e); }
  };
}

/* ══════════════════════════════════════════════════════════════════
   TURMAS
   ══════════════════════════════════════════════════════════════════ */
async function telaTurmas(){
  const als = await sel('pv_aluno', 'id,nome_guerra,email,turma_id,ativo,criado_em',
    q => q.order('nome_guerra'));
  const cont = {}; als.forEach(a => cont[a.turma_id] = (cont[a.turma_id]||0) + 1);
  const nomeT = id => S.turmas.find(t => t.id === id)?.nome || '—';

  /* Cadastro sem e-mail = conta anônima que vazou da sala ao vivo. O cadete tem
     acesso mas nunca conseguirá entrar de novo. Isolado aqui em cima para não
     passar despercebido no meio da lista. */
  const orfaos = als.filter(a => !a.email);
  const pend = new Map();   // aluno_id -> turma_id de destino, ainda não aplicado

  app.innerHTML = `<div class="cx"><h2>Turmas e códigos de cadastro</h2>
    <div class="rolar"><table><thead><tr><th>Turma</th><th>Código</th><th>Cadetes</th>
      <th>Ativa</th></tr></thead><tbody>
      ${S.turmas.map(t => `<tr>
        <td>${esc(t.nome)}</td>
        <td><input value="${esc(t.codigo)}" data-cod="${t.id}" maxlength="6"
          style="width:110px;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase"></td>
        <td class="num">${cont[t.id]||0}</td>
        <td>${t.ativa ? '<span class="selo ok">sim</span>' : '<span class="dim">não</span>'}</td>
      </tr>`).join('')}</tbody></table></div>
    <div class="linha"><button class="btn solid" id="svc">Salvar códigos</button>
      <button class="btn" id="csv">Baixar lista de cadetes</button></div>
    <p class="meta" style="margin-top:12px;text-transform:none;letter-spacing:.04em">
      O código é o que amarra o cadastro do cadete à turma certa. Seis caracteres,
      letras e números. Troque a cada ano.</p></div>

    ${orfaos.length ? `<div class="cx">
      <h2>Cadastros sem conta de e-mail (${orfaos.length})</h2>
      <p class="dim">Criados por sessão anônima herdada da sala ao vivo. O cadete entrou
        sem e-mail e sem senha — e não vai conseguir voltar. Exclua o registro e peça que
        ele crie a conta pela porta da avaliação.</p>
      <div class="rolar" style="margin-top:12px"><table><thead><tr><th>Nome de guerra</th>
        <th>Turma</th><th>Cadastro</th><th></th></tr></thead><tbody>
        ${orfaos.map(a => `<tr><td>${esc(a.nome_guerra)}</td>
          <td class="dim">${esc(nomeT(a.turma_id))}</td>
          <td class="num dim">${dt(a.criado_em)}</td>
          <td><button class="btn mini" data-x="${a.id}">Excluir cadastro</button></td>
        </tr>`).join('')}</tbody></table></div></div>` : ''}

    <div class="cx"><h2>Cadetes cadastrados (${als.length})</h2>
    ${als.length ? `<div class="linha" style="margin:0 0 14px">
        <input id="busca" placeholder="Filtrar por nome de guerra ou e-mail"
          style="max-width:300px" autocomplete="off">
        <select id="fturma" style="max-width:200px"><option value="">Todas as turmas</option>
          ${S.turmas.map(t => `<option value="${t.id}">${esc(t.nome)}</option>`).join('')}
        </select></div>
      <div id="lista"></div>
      <div class="linha"><button class="btn solid" id="aplicar" disabled>Aplicar realocações</button>
        <button class="btn" id="desfazer" disabled>Descartar</button></div>
      <p class="meta" style="margin-top:12px;text-transform:none;letter-spacing:.04em">
        Troque a turma no seletor da linha e confirme em "Aplicar". Cadete com prova em
        andamento não é movido — encerre ou aguarde a entrega antes.</p>`
      : `<p class="vazio">Nenhum cadete se cadastrou ainda</p>`}</div>`;

  /* ── lista filtrável ── */
  function pintarLista(){
    const alvo = document.getElementById('lista');
    if (!alvo) return;
    const termo = (document.getElementById('busca').value || '').trim().toLowerCase();
    const ft = document.getElementById('fturma').value;
    const vis = als.filter(a =>
      (!ft || a.turma_id === ft) &&
      (!termo || (a.nome_guerra||'').toLowerCase().includes(termo)
              || (a.email||'').toLowerCase().includes(termo)));

    alvo.innerHTML = vis.length ? `<div class="rolar"><table><thead><tr>
      <th>Nome de guerra</th><th>Turma</th><th>E-mail</th><th>Cadastro</th>
      </tr></thead><tbody>
      ${vis.map(a => {
        const dest = pend.get(a.id) || a.turma_id;
        return `<tr class="${dest !== a.turma_id ? 'mv' : ''}">
          <td>${esc(a.nome_guerra)}${a.email ? '' :
            ' <span class="selo viva">sem e-mail</span>'}</td>
          <td><select data-mv="${a.id}" style="min-width:150px">${S.turmas.map(t =>
            `<option value="${t.id}" ${t.id===dest?'selected':''}>${esc(t.nome)}</option>`
            ).join('')}</select></td>
          <td class="dim" style="font-size:.82rem">${esc(a.email || '—')}</td>
          <td class="num dim">${dt(a.criado_em)}</td></tr>`;
      }).join('')}</tbody></table></div>
      <p class="meta" style="margin-top:10px">${vis.length} de ${als.length} cadetes</p>`
      : `<p class="vazio">Nenhum cadete neste filtro</p>`;

    alvo.querySelectorAll('[data-mv]').forEach(s_ => s_.onchange = () => {
      const a = als.find(x => x.id === s_.dataset.mv);
      if (s_.value === a.turma_id) pend.delete(a.id); else pend.set(a.id, s_.value);
      s_.closest('tr').classList.toggle('mv', s_.value !== a.turma_id);
      pintarBotoes();
    });
  }
  function pintarBotoes(){
    const b = document.getElementById('aplicar');
    const d = document.getElementById('desfazer');
    if (!b) return;
    b.disabled = d.disabled = pend.size === 0;
    b.textContent = pend.size ? `Aplicar realocações (${pend.size})` : 'Aplicar realocações';
  }

  if (als.length){
    document.getElementById('busca').oninput = pintarLista;
    document.getElementById('fturma').onchange = pintarLista;
    pintarLista();

    document.getElementById('desfazer').onclick = () => {
      pend.clear(); pintarLista(); pintarBotoes(); };

    document.getElementById('aplicar').onclick = async ev => {
      const resumo = [...pend].map(([aid, tid]) => {
        const a = als.find(x => x.id === aid);
        return `${a.nome_guerra}:  ${nomeT(a.turma_id)}  →  ${nomeT(tid)}`;
      }).join('\n');
      if (!confirm(`Realocar ${pend.size} cadete(s)?\n\n${resumo}`)) return;
      ev.target.disabled = true;
      let feitas = 0, falhou = null;
      for (const [aid, tid] of pend){
        try { await rpc('pv_mover_aluno', { p_aluno:aid, p_turma:tid }); feitas++; }
        catch(e){ falhou = e; break; }
      }
      pend.clear();
      if (feitas) ok(`${feitas} cadete(s) realocado(s).`, true);
      if (falhou) erro(falhou);
      render();
    };
  }

  /* ── exclusão de cadastro órfão ── */
  app.querySelectorAll('[data-x]').forEach(b => b.onclick = async () => {
    const a = als.find(x => x.id === b.dataset.x);
    if (!confirm(`Excluir o cadastro de ${a.nome_guerra}?\n\n` +
      `O nome de guerra fica livre e o cadete terá de criar conta com e-mail. ` +
      `Se ele já tiver prova iniciada, a exclusão é recusada.`)) return;
    b.disabled = true;
    try { await rpc('pv_excluir_aluno', { p_aluno:a.id });
      ok(`Cadastro de ${a.nome_guerra} excluído.`, true); render(); }
    catch(e){ b.disabled = false; erro(e); }
  });

  /* ── códigos de turma ── */
  document.getElementById('svc').onclick = async ev => {
    ev.target.disabled = true;
    try {
      for (const inp of app.querySelectorAll('[data-cod]')){
        const v = inp.value.trim().toUpperCase();
        if (!/^[A-Z0-9]{6}$/.test(v)) throw new Error(`Código inválido: ${v} (6 letras/números)`);
        const { error } = await sb.from('pv_turma').update({ codigo:v }).eq('id', inp.dataset.cod);
        if (error) throw error;
      }
      S.turmas = await sel('pv_turma', 'id,nome,codigo,ativa', q => q.order('nome'));
      ok('Códigos salvos.'); ev.target.disabled = false;
    } catch(e){ ev.target.disabled = false; erro(e); }
  };
  document.getElementById('csv').onclick = () => baixarCSV('cadetes.csv',
    [['Nome de guerra','Turma','E-mail','Cadastro'],
     ...als.map(a => [a.nome_guerra, nomeT(a.turma_id), a.email || '', dt(a.criado_em)])]);
}

/* ══════════════════════════════════════════════════════════════════ */
rotear().catch(e => { app.innerHTML = ''; erro(e); });
</script>
</body>
</html>
