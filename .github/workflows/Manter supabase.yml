name: Manter Supabase acordado

# O plano free do Supabase pausa o projeto após 7 dias sem nenhuma requisição.
# Se isso acontecer, a sala ao vivo e a avaliação param, e o programa do site
# cai na lista local (que continua correta, mas congelada).
#
# Este job faz uma leitura da view pública de temas a cada 5 dias. É a
# requisição mais barata possível: três colunas de texto, sem nota, sem cadete.

on:
  schedule:
    # Dias 1, 6, 11, 16, 21 e 26 de cada mês, às 12h UTC (09h de Brasília).
    # O intervalo reinicia a cada mês: entre o dia 26 e o dia 1 passam-se
    # até 6 dias — ainda dentro da janela de 7.
    - cron: '0 12 1,6,11,16,21,26 * *'
  workflow_dispatch:        # permite disparar na mão pela aba Actions

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler a view pública de temas
        env:
          URL: https://ykkgybnsdmkqewjqkhfm.supabase.co
          KEY: sb_publishable_aqYO6MH3-cbK9K_azQ0G0A_0jYqopbW
        run: |
          codigo=$(curl -sS -o /tmp/r.json -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/pv_v_temas?select=numero&limit=1")
          echo "HTTP $codigo"
          cat /tmp/r.json
          # 200 = acordado. Qualquer outra coisa falha o job e o GitHub avisa por e-mail.
          test "$codigo" = "200"

# ATENÇÃO: o GitHub desliga workflows agendados em repositórios sem nenhuma
# atividade por 60 dias, e manda um e-mail antes. Se isso acontecer, basta
# reativar pela aba Actions ou fazer qualquer commit.
